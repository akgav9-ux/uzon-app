name: Validate adaptive video branch

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/video-hls-adaptive, feature/registration-simplification]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uzon_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Keep audit non-blocking while we remediate advisories one group at a time.
      - name: Audit dependency vulnerabilities (report only)
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const a=require(process.env.RUNNER_TEMP+"/npm-audit.json"); const items=Object.values(a.vulnerabilities||{}); console.log("npm audit:", a.metadata?.vulnerabilities||{}); for (const v of items) { const via=(v.via||[]).map(x=>typeof x==="string"?x:(x.title+" ["+x.range+"]")).join("; "); console.log(JSON.stringify({name:v.name,severity:v.severity,isDirect:v.isDirect,range:v.range,via,fixAvailable:v.fixAvailable})); }'
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
