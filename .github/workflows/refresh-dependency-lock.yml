name: Refresh dependency lockfile

on:
  push:
    branches:
      - feature/registration-simplification
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: dependency-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/registration-simplification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile [lock-refresh]"
          git push origin HEAD:feature/registration-simplification
